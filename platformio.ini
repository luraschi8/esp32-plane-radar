; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

; Without this, a bare `pio run` also tries to build src/ under [env:native]
; (host, no Arduino) and fails. Tests are run explicitly with `-e native`.
[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; The framework ships -Wno-format, and project build_flags are emitted before
; the framework's, so a bare -Wformat would be overridden. Unflag it, then turn
; it into an error for our sources only -- build_src_flags does not apply to the
; libraries, which have their own pre-existing format noise. Verified: passing
; an integer to %s in the fetch task used to compile clean. -Wall -Wextra are
; scoped the same way; src/ and include/ build clean under them today.
build_unflags = -Wno-format
build_src_flags = -Wformat -Werror=format -Wall -Wextra

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Same firmware with verbose logging compiled in (include/debug_log.h). Not a
; separate code path -- identical sources, one -D. Use it to diagnose on real
; hardware, then flash `supermini` again; the release image carries none of it.
[env:supermini-debug]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DPLANE_RADAR_DEBUG=1

; ---------------------------------------------------------------------------
; Host-side unit tests. Built by `pio test -e native` only -- `pio run` never
; compiles test/, so none of this reaches the firmware image.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -I test/mocks
  -I test
  -I include
  -DUNIT_TEST
  ; Costs ~1.5 s on the whole suite and turns a static-buffer overrun (the strip
  ; cap, the aircraft array, the tag-rect table) into a clean abort naming the
  ; line, instead of undefined behaviour that may or may not show up as a
  ; failure. Host-only: never reaches the firmware.
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -DUNITY_INCLUDE_DOUBLE
  -DUNITY_DOUBLE_PRECISION=1e-9
build_type = debug
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
